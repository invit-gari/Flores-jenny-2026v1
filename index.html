<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080612">
  <meta name="description" content="Una galaxia de flores amarillas para Jenny">
  <title>Para Jenny 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="nebula nebula-a" aria-hidden="true"></div>
  <div class="nebula nebula-b" aria-hidden="true"></div>

  <main id="app" class="scene">
    <section id="intro" class="intro">
      <div class="intro-orbit" aria-hidden="true">
        <span class="orbit-flower">🌻</span>
        <span class="orbit-dot"></span>
      </div>
      <p class="eyebrow">PARA ALGUIEN MUY ESPECIAL</p>
      <h1>Una galaxia para ti</h1>
      <p class="intro-copy">Hay cosas que se sienten mejor cuando se dicen con flores.</p>
      <button id="startBtn" class="start-btn" type="button">
        <span>🌻</span> Toca para iniciar
      </button>
    </section>

    <section id="galaxy" class="galaxy" hidden>
      <div id="stars" class="stars" aria-hidden="true"></div>
      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="centerpiece">
        <div class="flower-ring" aria-hidden="true">
          <span>🌻</span><span>🌼</span><span>🌻</span><span>🌼</span>
          <span>🌻</span><span>🌼</span><span>🌻</span><span>🌼</span>
        </div>
        <div class="flower-main">🌻</div>
        <p class="small-title">MI GALAXIA</p>
        <h2>Jenny</h2>
        <p id="centerMessage">Te amo</p>
      </div>

      <div id="photos" class="photos" aria-label="Fotos">
        <!-- Agrega imágenes dentro de assets/fotos y conserva estos nombres,
             o cambia las rutas desde script.js. -->
        <figure class="photo-card photo-1">
          <img src="assets/fotos/foto1.jpg" alt="Foto 1" onerror="this.parentElement.classList.add('empty')">
        </figure>
        <figure class="photo-card photo-2">
          <img src="assets/fotos/foto2.jpg" alt="Foto 2" onerror="this.parentElement.classList.add('empty')">
        </figure>
        <figure class="photo-card photo-3">
          <img src="assets/fotos/foto3.jpg" alt="Foto 3" onerror="this.parentElement.classList.add('empty')">
        </figure>
      </div>

      <div class="controls">
        <button id="musicBtn" class="control" type="button" aria-label="Activar música">🎵 Música</button>
        <button id="restartBtn" class="control" type="button">↻ Reiniciar</button>
      </div>
      <audio id="music" src="assets/musica.mp3" preload="auto" loop></audio>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
